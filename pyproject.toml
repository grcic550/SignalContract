[project]
name = "signalcontract"
version = "0.0.1"
description = "SignalContract learning and thesis development repository"
readme = "README.md"
authors = [
    { name = "Ante Grčić", email = "antegrcic550@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.1",
]

[project.scripts]
signalcontract = "signalcontract.cli:app"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
